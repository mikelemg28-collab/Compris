<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Compri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E7DCC5;
    --bg-deep: #D9CBA9;
    --ink: #241F1B;
    --ink-soft: #6B5F4E;
    --card: #FFFDF7;
    --yellow: #E7A72C;
    --green: #35603F;
    --green-deep: #24462C;
    --red: #C1442E;
    --line: #C9BA9C;
    --line-strong: #A9976F;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-deep);
    font-family:'Inter', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,36,32,0.05) 1px, transparent 1px);
    background-size: 14px 14px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  h1,h2,h3{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    margin:0;
    color: var(--ink);
    letter-spacing:-0.01em;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  header.top{
    padding: 22px 20px 16px;
    position:sticky; top:0; z-index:5;
    background: var(--bg);
    border-bottom: 2px dashed var(--line-strong);
  }
  header.top .brand{ display:flex; align-items:center; gap:8px; }
  header.top .brand h1{ font-size:26px; }
  header.top .brand .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color: var(--green-deep);
    background: rgba(53,96,63,0.12);
    padding:2px 7px; border-radius: 20px;
    text-transform:uppercase; letter-spacing:.06em;
  }
  header.top .sub{ margin-top:4px; font-size:13px; color: var(--ink-soft); }

  main{ flex:1; padding: 18px 16px 100px; }

  .card{
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: 0 2px 0 rgba(43,36,32,0.06);
    padding: 16px; margin-bottom: 14px;
  }
  .card h2{ font-size:17px; margin-bottom:4px; font-weight:700; }
  .muted{ color: var(--ink-soft); font-size:13px; line-height:1.5; }

  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color: var(--ink-soft); margin: 4px 0 10px;
  }

  button{ font-family:inherit; cursor:pointer; }
  .btn{
    border:none; border-radius:10px; padding:11px 16px;
    font-weight:700; font-size:14px;
    display:inline-flex; align-items:center; gap:6px;
    transition: transform .08s ease; font-family:'Manrope', sans-serif;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--green); color:#fff; }
  .btn-primary:hover{ background: var(--green-deep); }
  .btn-yellow{ background: var(--yellow); color: var(--ink); }
  .btn-outline{ background: transparent; border:1.5px solid var(--line-strong); color: var(--ink); }
  .btn-ghost{ background: transparent; color: var(--green-deep); padding:6px 8px; font-size:13px; }
  .btn-danger{ background: transparent; color: var(--red); padding:6px 8px; font-size:13px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:7px 11px; font-size:12.5px; border-radius:8px; }

  nav.tabs{
    position: sticky; bottom:0; max-width:480px;
    background: var(--card); border-top: 2px solid var(--ink);
    display:flex; z-index:10; padding:5px 4px;
  }
  nav.tabs button{
    flex:1; background:none; border:none; padding: 8px 2px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--ink-soft); font-size:10.5px; font-weight:700; font-family:'Manrope', sans-serif;
    border-radius: 12px; margin: 0 3px;
    transition: background .15s ease, color .15s ease;
  }
  nav.tabs button svg{ width:20px; height:20px; transition: stroke .15s ease; }
  nav.tabs button.active{ color: #fff; background: var(--green); box-shadow: 0 2px 0 rgba(36,70,44,0.35); }
  nav.tabs button.active svg{ stroke: #fff; }

  .stepper{ display:flex; align-items:center; gap:12px; }
  .stepper button{
    width:34px; height:34px; border-radius:9px; border:1.5px solid var(--line-strong);
    background:#fff; font-size:18px; font-weight:700; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .stepper .val{ font-family:'Manrope',sans-serif; font-weight:800; font-size:19px; min-width:20px; text-align:center; }

  .day-card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding:14px; margin-bottom:10px;
  }
  .day-card .day-name{
    font-family:'Manrope', sans-serif; font-weight:800; font-size:15.5px;
    border-bottom:1px dashed var(--line-strong); padding-bottom:8px; margin-bottom:8px;
  }
  .meal-slot{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:9px 0; border-bottom:1px dotted var(--line); font-size:13px;
  }
  .meal-slot:last-child{ border-bottom:none; }
  .meal-slot .label{ color: var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; width:70px; flex-shrink:0; padding-top:2px;}
  .meal-slot .recipe-name{ flex:1; text-align:right; font-weight:600; line-height:1.4; }
  .meal-slot .recipe-name.empty{ color: var(--line-strong); font-style:italic; font-weight:400;}
  .meal-slot .recipe-name .rn-item{ display:block; }

  .receipt{
    background: var(--card); border-radius: 4px; position:relative;
    padding: 20px 18px 10px; box-shadow: 0 3px 0 rgba(43,36,32,0.08);
  }
  .receipt::before{
    content:""; position:absolute; top:-6px; left:0; right:0; height:12px;
    background-image: radial-gradient(circle, var(--bg) 6px, transparent 6.5px);
    background-size: 16px 16px; background-position: -4px -4px;
  }
  .receipt-head{ text-align:center; margin-bottom:10px; }
  .receipt-head .store-tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: var(--green-deep); }
  .cat-block{ margin-bottom:6px; }
  .cat-title{
    font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:#fff; background: var(--green-deep); display:inline-block; padding:3px 9px; border-radius:20px;
    margin: 10px 0 6px;
  }
  .item-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); }
  .item-row:last-child{ border-bottom:none; }
  .item-row .check{
    width:20px; height:20px; border-radius:5px; border:2px solid var(--line-strong);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .item-row.checked .check{ background: var(--green); border-color: var(--green); }
  .item-row.checked .check svg{ display:block; }
  .item-row .check svg{ display:none; width:13px; height:13px; stroke:#fff; }
  .item-row .iname{ flex:1; font-size:14px; font-weight:500; }
  .item-row.checked .iname{ text-decoration: line-through; color: var(--ink-soft); }
  .item-row .qty{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color: var(--ink-soft); white-space:nowrap; }
  .item-row .del{ background:none;border:none; color:var(--red); opacity:.55; padding:2px 4px; font-size:15px; }
  .store-chips{ display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .store-chip{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase;
    background: rgba(231,167,44,0.22); color:#7A5411; padding:1.5px 6px; border-radius:8px;
  }

  .recipe-card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding:13px; margin-bottom:10px;
  }
  .recipe-card .rtitle{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .recipe-card h3{ font-size:15.5px; font-weight:700;}
  .recipe-card .ring{ font-size:12px; color: var(--ink-soft); margin-top:4px; }
  .type-tag{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em;
    padding:2px 7px; border-radius:8px; display:inline-block; margin-top:5px; font-weight:600;
  }
  .badge-source{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase;
    padding:2px 6px; border-radius:8px; flex-shrink:0; margin-top:2px;
  }
  .badge-source.manual{ background: rgba(53,96,63,0.15); color: var(--green-deep); }
  .badge-source.web{ background: rgba(193,68,46,0.13); color: var(--red); }
  .badge-source.imported{ background: rgba(231,167,44,0.25); color: #7A5411; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:700; color: var(--ink-soft); margin-bottom:5px; font-family:'Manrope',sans-serif;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; border-radius:9px; border:1.5px solid var(--line-strong);
    font-family:inherit; font-size:14px; background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .ing-row{ display:flex; gap:6px; margin-bottom:8px; align-items:center; }
  .ing-row input[type=text]{ flex:2; }
  .ing-row input[type=number]{ flex:1; width:56px; }
  .ing-row select{ flex:1.4; }
  .ing-row button{ flex-shrink:0; background:none; border:none; color:var(--red); font-size:18px; padding:4px;}

  .store-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:9px; margin-top:10px; }
  .store-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    background:#fff; border:1.5px solid var(--line-strong); border-radius:11px;
    padding:11px 12px; text-align:left;
  }
  .store-btn .sname{ font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; }
  .store-btn .sfound{ font-size:10.5px; color: var(--green-deep); font-family:'IBM Plex Mono',monospace; }

  .pick-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); cursor:pointer; }
  .pick-row:last-child{ border-bottom:none; }
  .pick-row .box{
    width:20px; height:20px; border-radius:5px; border:2px solid var(--line-strong);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .pick-row.on .box{ background: var(--green); border-color: var(--green); }
  .pick-row .box svg{ display:none; width:13px; height:13px; stroke:#fff; }
  .pick-row.on .box svg{ display:block; }
  .pick-row .pname{ flex:1; font-weight:600; font-size:14px; }
  .pick-row .pmeta{ font-size:11px; color: var(--ink-soft); font-family:'IBM Plex Mono',monospace; }

  .filter-pills{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .filter-pill{
    padding:6px 12px; border-radius:20px; border:1.5px solid;
    background:#fff; font-size:12px; font-weight:700; font-family:'Manrope',sans-serif;
  }

  .empty-state{ text-align:center; padding: 30px 14px; color: var(--ink-soft); }
  .empty-state .big{ font-family:'Manrope',sans-serif; font-weight:800; font-size:16px; color: var(--ink); margin-bottom:4px;}

  .modal-overlay{
    position:fixed; inset:0; background: rgba(43,36,32,0.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-sheet{
    background: var(--bg); width:100%; max-width:480px; border-radius: 20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding: 18px 18px 26px; animation: slideUp .22s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-head h2{ font-size:18px; font-weight:800; }
  .modal-head button{ background:none;border:none;font-size:22px;color:var(--ink-soft);}

  .period-toggle{ display:flex; gap:8px; }
  .period-toggle button{ flex:1; }

  .file-btn{ position:relative; overflow:hidden; }
  .file-btn input[type=file]{
    position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
  }

  .help-btn{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line-strong);
    background:#fff; font-family:'Manrope',sans-serif; font-weight:800; font-size:15px;
    color: var(--green-deep); flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .help-body h3{ font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; margin:16px 0 6px; color:var(--ink); }
  .help-body h3:first-child{ margin-top:4px; }
  .help-body p{ margin:4px 0; font-size:13px; color:var(--ink-soft); line-height:1.55; }
  .help-body ul{ margin:6px 0 10px 18px; padding:0; font-size:13px; color:var(--ink-soft); line-height:1.6; }
  .help-body strong{ color:var(--ink); font-weight:700; }
  .help-body code{ background:rgba(107,95,78,0.12); padding:1px 5px; border-radius:5px; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .help-tip{
    background: rgba(231,167,44,0.18); border-left:3px solid var(--yellow);
    padding:9px 11px; border-radius:8px; font-size:12.5px; color:#7A5411; margin:12px 0;
  }
  .tour-emoji{ font-size:34px; text-align:center; margin-bottom:2px; }
  .tour-title{ text-align:center; margin-top:2px !important; }
  .tour-dots{ display:flex; justify-content:center; gap:6px; margin:16px 0 6px; }
  .tour-dot{ width:7px; height:7px; border-radius:50%; background: var(--line-strong); transition: all .2s ease; }
  .tour-dot.active{ background: var(--green); width:18px; border-radius:4px; }
  .tour-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; gap:8px; }
  .tour-nav .btn{ flex:none; }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--green-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26" style="flex-shrink:0;">
        <circle cx="9" cy="20" r="1.4" fill="var(--green-deep)" stroke="none"/>
        <circle cx="18" cy="20" r="1.4" fill="var(--green-deep)" stroke="none"/>
        <path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 8H6"/>
      </svg>
      <h1>Compri</h1>
      <span class="tag" id="periodTag">semana</span>
    </div>
    <div class="sub" id="headerSub">Organizá tus comidas, armá la compra.</div>
  </header>

  <main id="main"></main>

  <nav class="tabs">
    <button data-tab="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>
      Inicio
    </button>
    <button data-tab="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4v0M16 4v0"/></svg>
      Menú
    </button>
    <button data-tab="recetas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>
      Recetas
    </button>
    <button data-tab="lista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>
      Lista
    </button>
    <button data-tab="supers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Súper
    </button>
  </nav>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script>
/* =========================================================
   COMPRI — estado y persistencia
========================================================= */
const STORES = [
  { id:'tiendainglesa', name:'Tienda Inglesa', url:'https://www.tiendainglesa.com.uy/supermercado' },
  { id:'disco', name:'Disco', url:'https://www.disco.com.uy/' },
  { id:'tata', name:'Tata', url:'https://www.tata.com.uy/' },
  { id:'geant', name:'Géant', url:'https://www.geant.com.uy/' },
  { id:'devoto', name:'Devoto', url:'https://www.devoto.com.uy/' },
  { id:'eldorado', name:'El Dorado', url:'https://www.eldorado.com.uy/' },
];
function allStores(){ return [...STORES, ...data.customStores]; }
function buildStoreSearchUrl(store, query){
  const base = store.url.replace(/\/$/, '');
  const sep = base.includes('?') ? '&' : '?';
  return base + sep + '_q=' + encodeURIComponent(query) + '&map=ft';
}

const CATEGORIES = ['Verdulería','Almacén','Carnicería','Panadería','Lácteos','Fiambrería','Bebidas','Congelados','Otros'];
const UNITS = ['unidad','g','kg','ml','l','paquete','atado','cucharada','taza','pizca'];
const MEALS = [ {k:'desayuno', l:'Desayuno'}, {k:'almuerzo', l:'Almuerzo'}, {k:'cena', l:'Cena'} ];
const DAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

const RECIPE_TYPES = ['Plato principal','Acompañamiento','Ensalada','Sopa/crema','Pastas','Salsas','Postre','Desayuno/Merienda','Otro'];
const TYPE_COLORS = {
  'Plato principal':   { c:'#24462C', bg:'rgba(36,70,44,0.15)' },
  'Acompañamiento':    { c:'#8A6A12', bg:'rgba(231,167,44,0.22)' },
  'Ensalada':          { c:'#5A7A1E', bg:'rgba(120,160,40,0.18)' },
  'Sopa/crema':        { c:'#2E6E8E', bg:'rgba(46,110,142,0.16)' },
  'Pastas':            { c:'#8C6239', bg:'rgba(140,98,57,0.18)' },
  'Salsas':            { c:'#C1442E', bg:'rgba(193,68,46,0.15)' },
  'Postre':            { c:'#B0507A', bg:'rgba(176,80,122,0.16)' },
  'Desayuno/Merienda': { c:'#C06A1E', bg:'rgba(217,123,41,0.18)' },
  'Otro':              { c:'#6B5F4E', bg:'rgba(107,95,78,0.14)' },
};
function typeColor(t){ return TYPE_COLORS[t] || TYPE_COLORS['Otro']; }
const TODAS_COLOR = { c:'#24462C', bg:'rgba(36,70,44,0.15)' };

const STORAGE_KEY = 'compri_data_v4';

function ing(name, qty, unit, category){ return {name, qty, unit, category}; }

function seedRecipes(){
  return [
    { id:'seed1', name:'Tortilla de papas española', servings:4, type:'Plato principal', source:'web',
      url:'https://www.paulinacocina.net/tortilla-de-papas-espanola/10476',
      ingredients:[
        ing('Huevos',4,'unidad','Lácteos'),
        ing('Papas medianas',3,'unidad','Verdulería'),
        ing('Cebolla',0.5,'unidad','Verdulería'),
        ing('Sal',1,'pizca','Almacén'),
        ing('Aceite',3,'cucharada','Almacén'),
      ]},
    { id:'seed2', name:'Pascualina', servings:8, type:'Plato principal', source:'web',
      url:'https://cookpad.com/uy/recetas/26011875?ref=search&search_term=pascualina',
      ingredients:[
        ing('Acelga',4,'atado','Verdulería'),
        ing('Huevos',6,'unidad','Lácteos'),
        ing('Sal',1,'pizca','Almacén'),
        ing('Nuez moscada',1,'pizca','Almacén'),
        ing('Harina',2,'taza','Almacén'),
        ing('Aceite',0.5,'taza','Almacén'),
        ing('Polvo de hornear',1,'cucharada','Almacén'),
        ing('Cebolla',1,'unidad','Verdulería'),
        ing('Morrón',0.5,'unidad','Verdulería'),
      ]},
    { id:'seed3', name:'Chow fan de pollo', servings:4, type:'Plato principal', source:'web',
      url:'https://www.paulinacocina.net/chow-fan/40157',
      ingredients:[
        ing('Arroz cocido grano largo',3,'taza','Almacén'),
        ing('Pechugas de pollo',2,'unidad','Carnicería'),
        ing('Zanahoria',1,'unidad','Verdulería'),
        ing('Pimiento rojo',0.5,'unidad','Verdulería'),
        ing('Huevos',3,'unidad','Lácteos'),
        ing('Ajo',2,'unidad','Verdulería'),
        ing('Salsa de soja',3,'cucharada','Almacén'),
        ing('Aceite de sésamo',1,'cucharada','Almacén'),
        ing('Cebolla de verdeo',2,'unidad','Verdulería'),
        ing('Aceite neutro',2,'cucharada','Almacén'),

function defaultData(){
  return {
    period: 'semana',
    people: 4,
    days: buildDays('semana'),
    recipes: seedRecipes(),
    shoppingList: [],
    templates: [],
    customStores: [],
    activeTab: 'inicio',
  };
}
function buildDays(period){
  const n = period === 'quincena' ? 14 : 7;
  const days = [];
  for(let i=0;i<n;i++){
    days.push({ label: DAY_NAMES[i%7] + (i>=7 ? ' (2)' : ''), meals: { desayuno:[], almuerzo:[], cena:[] } });
  }
  return days;
}

let data = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultData(), parsed);
  }catch(e){ return defaultData(); }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function presentRecipeTypes(){
  const set = new Set(data.recipes.map(r=> r.type || 'Otro'));
  return RECIPE_TYPES.filter(t=> set.has(t));

function renderFilterPills(container, filterOpts, currentVal, onPick){
  container.innerHTML = `<div class="filter-pills">${filterOpts.map(o=>{
    const col = o==='Todas' ? TODAS_COLOR : typeColor(o);
    const active = currentVal===o;
    const style = active
      ? `background:${col.c}; border-color:${col.c}; color:#fff;`
      : `background:#fff; border-color:${col.c}; color:${col.c};`;
    return `<button type="button" class="filter-pill" data-f="${o}" style="${style}">${o}</button>`;
  }).join('')}</div>`;
  container.querySelectorAll('.filter-pill').forEach(b=>{
    b.addEventListener('click', ()=> onPick(b.dataset.f));
  });
}

function openHelpModal(){
  let step = 0;
  openModal('¿Cómo funciona Compri?', `
    <div id="tourStep"></div>
    <div class="tour-dots" id="tourDots"></div>
    <div class="tour-nav" id="tourNav"></div>
  `);
  const stepEl = document.getElementById('tourStep');
  const dotsEl = document.getElementById('tourDots');
  const navEl = document.getElementById('tourNav');

  function renderStep(){
    const s = HELP_STEPS[step];
    stepEl.innerHTML = `<div class="help-body">
      <div class="tour-emoji">${s.emoji}</div>
      <h3 class="tour-title">${s.title}</h3>
      ${s.body}
      ${s.tip ? `<div class="help-tip">${s.tip}</div>` : ''}
    </div>`;
    dotsEl.innerHTML = HELP_STEPS.map((_,i)=>`<span class="tour-dot ${i===step?'active':''}"></span>`).join('');
    const isLast = step === HELP_STEPS.length-1;
    navEl.innerHTML = `
      ${step>0 ? '<button class="btn btn-outline" id="tourBack">Atrás</button>' : '<span></span>'}
      <button class="btn btn-primary" id="tourNext">${isLast ? 'Entendido' : 'Siguiente'}</button>
    `;
    if(step>0) navEl.querySelector('#tourBack').onclick = ()=>{ step--; renderStep(); };
    navEl.querySelector('#tourNext').onclick = ()=>{
      if(isLast){ closeModal(); } else { step++; renderStep(); }
    };
  }
  renderStep();
}

function changePeriod(p){
  if(p === data.period) return;
  if(!confirm(`Cambiar a ${p} va a reiniciar el menú actual (las recetas guardadas no se pierden). ¿Continuar?`)) return;
  data.period = p;
  data.days = buildDays(p);
  save(); render();
}

function openMealPicker(dayIdx, mealKey){
  const day = data.days[dayIdx];
  let selected = [...day.meals[mealKey]];
  let pickFilter = 'Todas';

  if(!data.recipes.length){
    openModal(`${day.label} · ${MEALS.find(m=>m.k===mealKey).l}`, `<p class="muted">Todavía no cargaste recetas. Andá a la pestaña <strong>Recetas</strong> para agregar alguna.</p>`);
    return;
  }

  openModal(`${day.label} · ${MEALS.find(m=>m.k===mealKey).l}`, `
    <p class="muted" style="margin-top:-6px; margin-bottom:10px;">Podés combinar varias recetas para esta comida.</p>
    <div id="pickFilters"></div>
    <div id="pickList"></div>
    <button class="btn btn-primary btn-block" id="pickSave" style="margin-top:14px;">Guardar selección</button>
  `);

  const filtersEl = document.getElementById('pickFilters');
  const listEl = document.getElementById('pickList');
  const filterOpts = ['Todas', ...presentRecipeTypes()];

  function refreshFilters(){
    renderFilterPills(filtersEl, filterOpts, pickFilter, (val)=>{ pickFilter = val; refreshFilters(); renderPickList(); });
  }

  function renderPickList(){
    const filtered = pickFilter==='Todas' ? data.recipes : data.recipes.filter(r=>(r.type||'Otro')===pickFilter);
    if(!filtered.length){
      listEl.innerHTML = `<p class="muted">No hay recetas en "${pickFilter}" todavía.</p>`;
      return;
    }
    listEl.innerHTML = filtered.map(r=>{
      const on = selected.includes(r.id);
      const meta = r.servings ? `Rinde ${r.servings} porc. · ~${Math.max(1, Math.floor(r.servings / (data.people||1)))} comida(s) para ${data.people}p` : '';
      return `
        <div class="pick-row ${on?'on':''}" data-rid="${r.id}">
          <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><polyline points="4,13 9,18 20,6"/></svg></div>
          <div style="flex:1;">
            <div class="pname">${r.name}</div>
            ${meta ? `<div class="pmeta">${meta}</div>` : ''}
          </div>
        </div>`;
    }).join('');
    listEl.querySelectorAll('.pick-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const rid = row.dataset.rid;
        if(selected.includes(rid)) selected = selected.filter(x=>x!==rid);
        else selected.push(rid);
        renderPickList();
      });
    });
  }

  refreshFilters();
  renderPickList();
  document.getElementById('pickSave').onclick = ()=>{
    day.meals[mealKey] = selected;
    save(); closeModal(); render();
  };
}

function saveTemplateFlow(){
  const name = prompt('¿Cómo querés llamar a esta plantilla?');
  if(!name) return;
  data.templates.push({ id: uid(), name, period: data.period, people: data.people, days: JSON.parse(JSON.stringify(data.days)) });
  save(); render();
}
function applyTemplate(id){
  const t = data.templates.find(x=>x.id===id);
  if(!t) return;
  if(!confirm(`Aplicar "${t.name}" reemplaza tu menú actual. ¿Seguimos?`)) return;
  data.period = t.period || data.period;
  data.people = t.people || data.people;
  data.days = JSON.parse(JSON.stringify(t.days));
  save(); render();
}

function exportRecipe(r){
  const payload = {
    compriRecipe: true, version: 1,
    name: r.name, servings: r.servings, type: r.type || 'Otro', url: r.url || '',
    ingredients: r.ingredients.map(i=>({name:i.name, qty:i.qty, unit:i.unit, category:i.category}))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const slug = r.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'receta';
  a.href = url; a.download = slug + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 3000);
}

function handleImportFiles(fileList){
  let importedCount = 0;
  let failedCount = 0;
  const files = Array.from(fileList);
  let pending = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const parsed = JSON.parse(e.target.result);
        const arr = Array.isArray(parsed) ? parsed : [parsed];
        arr.forEach(item=>{
          if(!item || !item.name || !Array.isArray(item.ingredients)) { failedCount++; return; }
          data.recipes.push({
            id: uid(),
            name: String(item.name),
            servings: parseInt(item.servings) || 4,
            type: RECIPE_TYPES.includes(item.type) ? item.type : 'Otro',
            source: 'imported',
            url: item.url || '',
            ingredients: item.ingredients.map(i=>({
              name: String(i.name||'').trim() || 'Ingrediente',
              qty: Number(i.qty) || 1,
              unit: UNITS.includes(i.unit) ? i.unit : 'unidad',
              category: CATEGORIES.includes(i.category) ? i.category : 'Otros'
            }))
          });
          importedCount++;
        });
      }catch(err){ failedCount++; }
      pending--;
      if(pending===0){
        save(); render();
        if(importedCount) alert(`Se importaron ${importedCount} receta${importedCount!==1?'s':''}.` + (failedCount? ` (${failedCount} archivo(s) no se pudieron leer)`:''));
        else alert('No se pudo importar ningún archivo. Verificá que sean archivos .json exportados desde Compri.');
      }
    };
    reader.onerror = ()=>{ failedCount++; pending--; if(pending===0){ save(); render(); } };
    reader.readAsText(file);
  });
}

  bodyWrap.querySelector('#addIng').onclick = ()=>{ ingredients.push({name:'',qty:1,unit:'unidad',category:'Otros'}); renderIngRows(); };

    } else {

    }
    save(); closeModal(); render();
  };
}

function generateShoppingList(){
  // 1) contar cuántas veces aparece cada receta en todo el menú (no por comida individual)
  const occurrences = {};
  data.days.forEach(day=>{
    MEALS.forEach(m=>{
      day.meals[m.k].forEach(rid=>{
        occurrences[rid] = (occurrences[rid]||0) + 1;
      });
    });
  });

  // 2) por receta, calcular cuántas "tandas" de la receta hacen falta según las porciones
  //    totales necesarias (apariciones x personas) contra lo que rinde la receta.
  //    Así, la misma tanda cubre varias comidas (sobras) sin duplicar ingredientes.
  const map = {};
  Object.keys(occurrences).forEach(rid=>{
    const r = getRecipe(rid);
    if(!r) return;
    const servings = r.servings || data.people || 1;
    const totalPortionsNeeded = occurrences[rid] * (data.people || 1);
    const batches = Math.max(1, Math.ceil(totalPortionsNeeded / servings));
    r.ingredients.forEach(ingr=>{
      const key = (ingr.name.trim().toLowerCase())+'|'+ingr.unit;
      if(!map[key]){
        map[key] = { id: uid(), name: ingr.name.trim(), qty:0, unit: ingr.unit, category: ingr.category, checked:false, manual:false, stores:[] };
      }
      map[key].qty += (Number(ingr.qty)||0) * batches;
    });
  });

  const manualItems = data.shoppingList.filter(i=>i.manual);
  const oldChecks = {};
  data.shoppingList.forEach(i=>{ oldChecks[(i.name.toLowerCase())+'|'+i.unit] = i.checked; });
  const generated = Object.values(map).map(i=>{
    const k = i.name.toLowerCase()+'|'+i.unit;
    if(oldChecks[k]!==undefined) i.checked = oldChecks[k];
    return i;
  });
  data.shoppingList = [...generated, ...manualItems];
  save();
}

function buildShareText(){
  const lines = [];
  lines.push('🧺 Lista de compra – Compri');
  lines.push(`${data.period} · ${data.people} persona${data.people!=1?'s':''}`);
  lines.push('');
  CATEGORIES.forEach(cat=>{
    const items = data.shoppingList.filter(i=>(i.category||'Otros')===cat);
    if(!items.length) return;
    lines.push(`*${cat}*`);
    items.forEach(i=>{
      const mark = i.checked ? '✅' : '▫️';
      lines.push(`${mark} ${trimNum(i.qty)} ${i.unit} - ${i.name}`);
    });
    lines.push('');
  });
  return lines.join('\n').trim();
}

    grid.appendChild(btn);
  });
  const addBtn = el('div','store-btn');
  addBtn.style.cssText = 'border-style:dashed; align-items:center; justify-content:center; text-align:center; color:var(--green-deep);';
  addBtn.innerHTML = `<span class="sname" style="width:100%; text-align:center;">+ Otro súper</span>`;
  addBtn.onclick = openAddStoreForm;
  grid.appendChild(addBtn);
  searchCard.appendChild(grid);

  const fromList = searchCard.querySelector('#sFromList');
  if(fromList){
    fromList.addEventListener('change', ()=>{
      const item = data.shoppingList.find(i=>i.id===fromList.value);
      if(item) searchCard.querySelector('#sQuery').value = item.name;
    });
  }

  if(data.customStores.length){
    const myStoresCard = el('div','card');
    myStoresCard.innerHTML = `<div class="section-label">Tus súper agregados</div>`;
    data.customStores.forEach(s=>{
      const row = el('div');
      row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);';
      row.innerHTML = `<span>${escapeHtml(s.name)}</span>`;
      const delBtn = mkBtn('Eliminar','btn-danger');
      delBtn.onclick = ()=> deleteCustomStore(s.id);
      row.appendChild(delBtn);
      myStoresCard.appendChild(row);
    });
    mainEl.appendChild(myStoresCard);
  }

  if(data.shoppingList.length){
    const assignCard = el('div','card');
    assignCard.innerHTML = `<h2 style="font-size:16px;">Marcar dónde lo encontraste</h2><p class="muted">Tocá los súper donde viste cada producto. Así arma la "Lista por súper" en la pestaña Lista.</p>`;
    data.shoppingList.forEach(item=>{
      const row = el('div');
      row.style.cssText = 'padding:10px 0; border-bottom:1px dashed var(--line);';
      row.innerHTML = `<div style="font-weight:700; font-family:'Manrope',sans-serif; font-size:13.5px; margin-bottom:6px;">${escapeHtml(item.name)}</div>
        <div style="display:flex; gap:5px; flex-wrap:wrap;">
          ${stores.map(s=>`<button class="btn btn-sm ${item.stores.includes(s.id)?'btn-primary':'btn-outline'}" data-store="${s.id}" data-item="${item.id}">${s.name}</button>`).join('')}
        </div>`;
      assignCard.appendChild(row);
    });
    mainEl.appendChild(assignCard);
    assignCard.querySelectorAll('button[data-store]').forEach(b=>{
      b.onclick = ()=>{
        const item = data.shoppingList.find(i=>i.id===b.dataset.item);
        const sid = b.dataset.store;
        if(item.stores.includes(sid)) item.stores = item.stores.filter(x=>x!==sid);
        else item.stores.push(sid);
        save(); render();
      };
    });
  }
}

function openAddStoreForm(){
  openModal('Agregar súper, almacén o verdulería', `
    <div class="field"><label>Nombre</label><input type="text" id="csName" placeholder="ej. Almacén Don Pepe"></div>
    <div class="field"><label>Sitio web (opcional)</label><input type="text" id="csUrl" placeholder="https://..."></div>
    <button class="btn btn-primary btn-block" id="csSave">Agregar</button>
    <p class="muted" style="margin-top:10px;">Si no tiene sitio web, igual podés agregarlo para marcarlo en tu lista — el botón de búsqueda simplemente no va a hacer nada para ese lugar.</p>
  `);
  document.getElementById('csSave').onclick = ()=>{
    const name = document.getElementById('csName').value.trim();
    if(!name){ alert('Ponele un nombre.'); return; }
    let url = document.getElementById('csUrl').value.trim();
    if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    data.customStores.push({ id: uid(), name, url });
    save(); closeModal(); render();
  };
}

function deleteCustomStore(id){
  if(!confirm('¿Eliminar este lugar de tu lista de súper?')) return;
  data.customStores = data.customStores.filter(s=>s.id!==id);
  data.shoppingList.forEach(i=>{ i.stores = i.stores.filter(s=>s!==id); });
  save(); render();
}

/* =========================================================
   HELPERS
========================================================= */
function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function mkBtn(text, cls){ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=text; return b; }
function getRecipe(id){ return data.recipes.find(r=>r.id===id); }
function storeName(id){ const s = allStores().find(x=>x.id===id); return s ? s.name : id; }
function trimNum(n){ n = Number(n); return Number.isInteger(n) ? n : n.toFixed(1); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const overlay = document.getElementById('modalOverlay');
const sheet = document.getElementById('modalSheet');
function openModal(title, bodyHtml){
  sheet.innerHTML = `<div class="modal-head"><h2>${title}</h2><button id="mClose">×</button></div><div>${bodyHtml}</div>`;
  overlay.classList.remove('hidden');
  sheet.querySelector('#mClose').onclick = closeModal;
}
function closeModal(){ overlay.classList.add('hidden'); }
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

render();
</script>
</body>
</html>
